name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      # The sandbox of the Chrome downloaded by Puppeteer needs unprivileged user namespaces, which Ubuntu restricts by default.
      - name: Allow Chrome to use its sandbox
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Integration tests
        run: npm run test:integration
